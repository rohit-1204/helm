apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service

spec:
  replicas: {{ .Values.product.replicas }}

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:

        - name: product

          image: "{{ .Values.product.image.repository }}:{{ .Values.product.image.tag }}"

          ports:
            - containerPort: 80
